schema_version: "1.1"
name: detect-human-essay-not-flagged
expected_outcome: |
  The skill scores the essay and finds it reads as human (low score), explains clearly that detectors
  produce false positives (especially on polished or old-fashioned prose) and that no score is proof,
  points to concrete human features in the essay, and suggests practical evidence the student can
  offer (drafts, version history, notes, discussing the essay). It does not accuse the student.
context:
  scaffold_script: place-files.sh
